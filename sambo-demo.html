<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>47Connect — 自治体AI参謀 MVPデモ</title>
<meta name="description" content="自治体AI参謀の右サイドバー常駐UI・参謀フォーマット応答を体感できるMVPデモ" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #FAFAFA;
    --bg-alt: #F4F4F4;
    --bg-dark: #1A1A1A;
    --ink: #1A1A1A;
    --ink-2: #4A4A4A;
    --ink-3: #8A8A8A;
    --line: #D9D9D9;
    --line-2: #ECECEC;
    --accent: #3071B9;
    --accent-soft: #E8F0F9;
    --accent-ink: #245593;
    --warn: #E9470B;
    --warn-soft: #FDECE3;
    --ok: #4CBBB4;
    --ok-soft: #E5F5F4;
    --sans: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Avenir Next",Avenir,sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
    --shadow: 0 1px 2px rgba(15,20,40,.04), 0 8px 28px -12px rgba(15,20,40,.08);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:none;background:none}

  /* ---- レイアウト ---- */
  .app{
    display:grid;
    grid-template-columns: 1fr 420px;
    height:100vh;
    transition: grid-template-columns .25s ease;
  }
  .app.collapsed{grid-template-columns: 1fr 56px}

  /* ---- ヘッダー ---- */
  .header{
    grid-column: 1 / -1;
    display:flex;align-items:center;justify-content:space-between;
    height:56px;padding:0 24px;
    background:#fff;border-bottom:1px solid var(--line-2);
    position:fixed;top:0;left:0;right:0;z-index:10;
  }
  .logo{font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
  .logo span{color:var(--accent-ink)}
  .header-mode{
    font-size:.72rem;color:var(--warn);background:var(--warn-soft);
    padding:4px 10px;border-radius:4px;font-weight:600;letter-spacing:.05em;
  }

  /* ---- メインエリア ---- */
  .main{
    overflow-y:auto;height:100vh;padding:80px 32px 32px;
  }
  .main h1{
    font-size:1.6rem;font-weight:700;margin-bottom:24px;letter-spacing:-.02em;
  }
  .main h1 small{
    display:block;font-size:.78rem;font-weight:500;color:var(--ink-3);
    letter-spacing:.04em;margin-top:6px;
  }

  /* 自治体切替バー */
  .muni-tabs{
    display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;
    padding-bottom:16px;border-bottom:1px solid var(--line-2);
  }
  .muni-tab{
    padding:8px 16px;border:1px solid var(--line);border-radius:999px;
    background:#fff;font-size:.88rem;color:var(--ink-2);
    transition:all .2s;
  }
  .muni-tab:hover{border-color:var(--accent);color:var(--accent-ink)}
  .muni-tab.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }

  /* 自治体プロファイル */
  .muni-profile{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .card{
    background:#fff;border:1px solid var(--line-2);border-radius:12px;
    padding:20px;
  }
  .card h3{
    font-size:.78rem;color:var(--ink-3);letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;margin-bottom:12px;
  }
  .card-content{font-size:.92rem;color:var(--ink);line-height:1.85}
  .card-content .num{
    font-family:var(--sans);font-weight:600;font-size:1.4rem;
    color:var(--accent-ink);display:block;margin-top:4px;
  }
  .card-content .label{font-size:.78rem;color:var(--ink-3)}
  .card-content ul{list-style:none}
  .card-content li{padding:6px 0;border-bottom:1px dashed var(--line-2)}
  .card-content li:last-child{border-bottom:none}
  .card-content li strong{color:var(--ink);font-weight:600}
  .badge-hi{
    display:inline-block;font-size:.7rem;color:var(--warn);
    background:var(--warn-soft);padding:2px 8px;border-radius:4px;
    margin-left:6px;font-weight:600;
  }

  /* 議事録ハイライト */
  .gijiroku{
    background:#fff;border:1px solid var(--line-2);border-radius:12px;
    padding:20px;margin-bottom:24px;
  }
  .gijiroku h3{
    font-size:.78rem;color:var(--ink-3);letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;margin-bottom:12px;
  }
  .giji-item{
    padding:10px 12px;background:var(--bg-alt);border-radius:6px;
    margin-bottom:8px;font-size:.86rem;
  }
  .giji-item .meta{
    font-family:var(--mono);font-size:.7rem;color:var(--ink-3);
    margin-bottom:4px;
  }

  @media (max-width:860px){
    .muni-profile{grid-template-columns:1fr}
  }

  /* ---- サイドバー ---- */
  .sidebar{
    background:#fff;border-left:1px solid var(--line-2);
    display:flex;flex-direction:column;height:100vh;padding-top:56px;
    overflow:hidden;transition: all .25s ease;
  }
  .app.collapsed .sidebar > *:not(.sidebar-toggle){display:none}
  .app.collapsed .sidebar-toggle{justify-content:center;padding:12px 0}

  .sidebar-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:var(--accent);color:#fff;
    font-weight:600;font-size:.88rem;letter-spacing:.02em;
    border-bottom:1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  }
  .sidebar-toggle:hover{background:var(--accent-ink)}
  .sidebar-toggle .icons{display:flex;align-items:center;gap:8px}
  .sidebar-context{
    padding:10px 16px;font-size:.78rem;color:var(--ink-3);
    background:var(--bg-alt);border-bottom:1px solid var(--line-2);
    display:flex;align-items:center;gap:6px;
  }
  .sidebar-context strong{color:var(--accent-ink);font-weight:600}
  .ctx-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* チャット履歴 */
  .chat{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:12px;
  }
  .msg{display:flex;gap:10px;animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{flex-direction:row-reverse}
  .msg-avatar{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
  }
  .msg.bot .msg-avatar{background:var(--ink);color:#fff}
  .msg.user .msg-avatar{background:var(--accent-soft);color:var(--accent-ink)}
  .msg-bubble{
    max-width:85%;padding:12px 14px;border-radius:12px;
    font-size:.88rem;line-height:1.7;
  }
  .msg.bot .msg-bubble{
    background:var(--bg-alt);color:var(--ink);
    border-top-left-radius:4px;
  }
  .msg.user .msg-bubble{
    background:var(--accent);color:#fff;
    border-top-right-radius:4px;
  }

  /* 参謀フォーマット */
  .verdict{
    display:inline-block;font-weight:700;font-size:.85rem;
    padding:6px 12px;border-radius:6px;margin-bottom:10px;
    letter-spacing:.05em;
  }
  .verdict.yes{background:#D6F0EE;color:#1F6D63}
  .verdict.no{background:#FCE0D5;color:#9B3308}
  .verdict.cond{background:#FEF1D9;color:#8B5A00}
  .verdict.recommend{background:var(--accent-soft);color:var(--accent-ink)}

  .reasons{margin:6px 0 10px 0}
  .reasons-title{
    font-size:.74rem;font-weight:700;color:var(--ink-3);
    letter-spacing:.1em;margin-bottom:4px;text-transform:uppercase;
  }
  .reasons-list{padding-left:18px}
  .reasons-list li{padding:3px 0;font-size:.86rem}

  .action{
    margin-top:8px;padding:10px 12px;background:#fff;border-radius:8px;
    border-left:3px solid var(--accent);font-size:.86rem;
  }
  .action-title{
    font-size:.74rem;font-weight:700;color:var(--accent-ink);
    letter-spacing:.1em;margin-bottom:4px;text-transform:uppercase;
  }

  .citation{
    margin-top:8px;font-size:.74rem;color:var(--ink-3);
    padding:6px 8px;background:#fff;border-radius:6px;
  }
  .citation-icon{margin-right:4px}

  .feedback{
    margin-top:10px;display:flex;gap:6px;
  }
  .fb-btn{
    padding:4px 10px;font-size:.74rem;border:1px solid var(--line);
    border-radius:999px;background:#fff;color:var(--ink-3);
    transition:all .15s;
  }
  .fb-btn:hover{border-color:var(--ink);color:var(--ink)}
  .fb-btn.active{
    background:var(--ok-soft);border-color:var(--ok);color:#1F6D63;
  }

  /* タイピングインジケーター */
  .typing{display:flex;gap:4px;padding:4px 0}
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--ink-3);
    animation:typing 1.4s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes typing{
    0%,60%,100%{opacity:.3;transform:translateY(0)}
    30%{opacity:1;transform:translateY(-3px)}
  }

  /* プリセット質問 */
  .presets{
    padding:8px 16px;border-top:1px solid var(--line-2);
    background:var(--bg-alt);
  }
  .presets-title{
    font-size:.7rem;color:var(--ink-3);letter-spacing:.08em;
    margin-bottom:6px;font-weight:600;text-transform:uppercase;
  }
  .preset-list{display:flex;flex-wrap:wrap;gap:6px}
  .preset-btn{
    padding:6px 10px;font-size:.78rem;background:#fff;
    border:1px solid var(--line);border-radius:6px;color:var(--ink-2);
    transition:all .15s;
  }
  .preset-btn:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

  /* 入力エリア */
  .input-area{
    padding:12px 16px;border-top:1px solid var(--line-2);background:#fff;
    display:flex;gap:8px;align-items:flex-end;
  }
  .input-area textarea{
    flex:1;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-family:var(--sans);font-size:.88rem;
    resize:none;min-height:38px;max-height:100px;line-height:1.5;
  }
  .input-area textarea:focus{outline:none;border-color:var(--accent)}
  .send-btn{
    padding:8px 14px;background:var(--accent);color:#fff;
    border-radius:8px;font-weight:600;font-size:.86rem;
    transition:all .2s;
  }
  .send-btn:hover{background:var(--accent-ink)}
  .send-btn:disabled{background:var(--ink-3);cursor:not-allowed}

  /* 期待値コントロール */
  .stage-banner{
    margin:8px 16px;padding:8px 10px;
    background:var(--warn-soft);border-left:3px solid var(--warn);
    border-radius:0 4px 4px 0;font-size:.74rem;color:var(--ink-2);
    line-height:1.6;
  }
  .stage-banner strong{color:var(--ink);font-weight:600}

  /* スクロールバー */
  .chat::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .chat::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:transparent}
</style>
</head>

</div>

// ============================================
// 状態管理
// ============================================
let currentMuni = "hamamatsu";
let chatHistory = {hamamatsu: [], toyama: [], oita: []};
let isResponding = false;

// ============================================
// レンダリング
// ============================================

function renderMuni(muniKey) {
  currentMuni = muniKey;
  const data = MUNI_DATA[muniKey];

  // タイトル
  const titleEl = document.getElementById("main-title");
  titleEl.innerHTML = `${data.title}<small>${data.sub}</small>`;

  // タブ
  document.querySelectorAll(".muni-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.muni === muniKey);
  });

  // プロフィール
  const profEl = document.getElementById("muni-profile");
  profEl.innerHTML = data.profile.map(p => `
    <div class="card">
      <h3>${p.h}</h3>
      <div class="card-content">${p.content}</div>
    </div>
  `).join("");

  // 議事録
  const gijiEl = document.getElementById("gijiroku");
  gijiEl.innerHTML = `
    <h3>関連議事録（御社事業との関連抽出）</h3>
    ${data.gijiroku.map(g => `
      <div class="giji-item">
        <div class="meta">${g.date}</div>
        <div>${g.text}</div>
      </div>
    `).join("")}
  `;

  // コンテキスト
  document.getElementById("ctx-muni").textContent = data.name;

  // チャット
  renderChat();

  // プリセット
  renderPresets(data.presets);
}

function renderPresets(presets) {
  const el = document.getElementById("presets");
  el.innerHTML = presets.map(p => `
    <button class="preset-btn" data-q="${p}">${p}</button>
  `).join("");
}

function renderChat() {
  const chatEl = document.getElementById("chat");
  const history = chatHistory[currentMuni];

  if (history.length === 0) {
    // 初期メッセージ
    const data = MUNI_DATA[currentMuni];
    chatEl.innerHTML = `
      <div class="msg bot">
        <div class="msg-avatar">🎖</div>
        <div class="msg-bubble">
          ${currentMuni === "hamamatsu" ? "こんにちは。私は御社の自治体ビジネス専属の参謀です。" : ""}
          ${data.name} について、データに基づいて結論をお伝えします。<br><br>
          <span style="color:var(--ink-3);font-size:.78rem">
          御社プロファイル想定: <strong>${COMPANY_CONTEXT}</strong><br>
          ※ 実運用ではオンボーディングで御社固有のプロファイルを学習します
          </span>
        </div>
      </div>
    `;
  } else {
    chatEl.innerHTML = history.map(m => renderMessage(m)).join("");
  }

  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderMessage(m) {
  if (m.role === "user") {
    return `
      <div class="msg user">
        <div class="msg-avatar">👤</div>
        <div class="msg-bubble">${escapeHtml(m.text)}</div>
      </div>
    `;
  }
  // bot
  if (m.format === "verdict") {
    return `
      <div class="msg bot">
        <div class="msg-avatar">🎖</div>
        <div class="msg-bubble">
          <div class="verdict ${m.verdict.type}">[結論] ${m.verdict.label}</div>
          <div class="reasons">
            <div class="reasons-title">理由</div>
            <ol class="reasons-list">
              ${m.reasons.map(r => `<li>${r}</li>`).join("")}
            </ol>
          </div>
          <div class="action">
            <div class="action-title">推奨アクション</div>
            ${m.action}
          </div>
          ${m.citation ? `<div class="citation">${m.citation}</div>` : ""}
          <div class="feedback">
            <button class="fb-btn" onclick="feedbackClick(this,'good')">👍 役立った</button>
            <button class="fb-btn" onclick="feedbackClick(this,'vague')">👎 ぼかしている</button>
            <button class="fb-btn" onclick="feedbackClick(this,'context')">👎 御社文脈と違う</button>
          </div>
        </div>
      </div>
    `;
  }
  // typing
  if (m.format === "typing") {
    return `
      <div class="msg bot">
        <div class="msg-avatar">🎖</div>
        <div class="msg-bubble">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      </div>
    `;
  }
  // plain
  return `
    <div class="msg bot">
      <div class="msg-avatar">🎖</div>
      <div class="msg-bubble">${m.text}</div>
    </div>
  `;
}

function feedbackClick(btn, type) {
  document.querySelectorAll(".fb-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

// ============================================
// 対話処理
// ============================================

async function handleUserInput(text) {
  if (isResponding || !text.trim()) return;
  isResponding = true;

  const history = chatHistory[currentMuni];
  history.push({role: "user", text});
  renderChat();

  // タイピング表示
  history.push({role: "bot", format: "typing"});
  renderChat();

  await sleep(900 + Math.random() * 600);

  // タイピングを取り除いて応答を追加
  history.pop();

  const key = `${currentMuni}:${text.trim()}`;
  const response = RESPONSES[key];

  if (response) {
    history.push({
      role: "bot",
      format: "verdict",
      verdict: response.verdict,
      reasons: response.reasons,
      action: response.action,
      citation: response.citation
    });
  } else {
    // フォールバック
    history.push({
      role: "bot",
      format: "verdict",
      verdict: {type: "recommend", label: "📊 データに基づく回答"},
      reasons: [
        "本MVPデモでは事前定義された質問パターンのみに参謀フォーマットで応答します",
        "実運用では御社プロファイルと自治体データを掛け合わせ、Claudeが御社固有の文脈で回答を生成します",
        "下のプリセット質問をお試しください"
      ],
      action: "下のプリセット質問から1つ選んでクリックしてください。実運用版では自由質問に対し、参謀フォーマット（結論→理由3点→推奨アクション）で必ず応答します。",
      citation: "📚 デモ仕様: モックデータ動作（Claude API未接続）"
    });
  }

  renderChat();
  isResponding = false;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ============================================
// イベントハンドラ
// ============================================

document.addEventListener("DOMContentLoaded", () => {
  // 自治体タブ
  document.querySelectorAll(".muni-tab").forEach(t => {
    t.addEventListener("click", () => renderMuni(t.dataset.muni));
  });

  // プリセット（イベント委譲）
  document.getElementById("presets").addEventListener("click", e => {
    if (e.target.classList.contains("preset-btn")) {
      handleUserInput(e.target.dataset.q);
    }
  });

  // 送信ボタン
  document.getElementById("sendBtn").addEventListener("click", () => {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (text) {
      handleUserInput(text);
      input.value = "";
    }
  });

  // Enter送信
  document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.getElementById("sendBtn").click();
    }
  });

  // サイドバー折りたたみ
  document.getElementById("toggleBtn").addEventListener("click", () => {
    document.getElementById("app").classList.toggle("collapsed");
  });

  // 初期表示
  renderMuni("hamamatsu");
});
</script>
